name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    # The ghcr and pypi jobs below need write scopes; this one doesn't.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      # The backend too: an editable install invokes it, and without this pip
      # would fetch its own copy unpinned, outside every other guarantee here.
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: ruff check src tests
      - run: pytest tests/ -q
      # Don't publish a release with a known-vulnerable dependency. Audits the
      # lockfile, which is what the image ships.
      - run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - run: >-
          pip-audit --progress-spinner off --require-hashes
          -r requirements.txt
          -r requirements-dev.txt
          -r requirements-build.txt
          -r .github/requirements-ci.txt

  ghcr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # build and the hatchling backend both pinned and hashed; --no-isolation
      # then uses them instead of letting build resolve its own backend.
      - run: python -m pip install --require-hashes -r .github/requirements-ci.txt
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - run: python -m build --no-isolation
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
