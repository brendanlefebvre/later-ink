version: 2

# Actions and the Docker base image, deliberately — plus one narrowly scoped
# Python entry.
#
# The point of this file is to make SHA-pinned actions maintainable. A pin with
# nothing to bump it goes stale, and a stale pin is its own risk — which is why
# pinning was declined twice before this existed. Dependabot understands a
# SHA-pinned `uses:` and updates both the hash and the trailing version comment,
# so the pins stay current without anyone resolving hashes by hand.
#
# The Python entry below is scoped to /.github deliberately, and the scoping is
# load-bearing rather than tidiness. Dependabot's pip ecosystem matches broadly
# — it scans *.txt and inspects contents to decide what is a manifest — so an
# entry rooted at / would also try to update requirements.txt,
# requirements-dev.txt and requirements-build.txt. Those are hash-pinned output
# from `uv pip compile`, which falls between Dependabot's two Python
# ecosystems: its pip-compile support expects a requirements.in source, and its
# native uv ecosystem expects a uv.lock from uv's project mode rather than the
# pip-compatible mode used here. Pointing it at them invites pull requests with
# missing or wrong hashes.
#
# .github/requirements-ci.txt does have a .in source, which is the shape
# Dependabot's pip-compile support is built for, so it is the one Python file
# here it stands a good chance of maintaining correctly. Treat that as unproven
# until a pull request actually arrives: if none does, or one arrives with
# broken hashes, drop this entry and bump the file by hand.
#
# The files left unautomated are not left unchecked. The audit job runs
# pip-audit --require-hashes over every lockfile on each pull request and
# release, so a dependency picking up a CVE fails visibly. What stays manual is
# routine version freshness; the regenerate commands are in README.md.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # One PR per ecosystem rather than eight. These move together, they're
      # all first-party GitHub or Docker actions, and CI proves them as a set.
      actions:
        patterns:
          - "*"

  # The Dockerfile's two FROM lines, which are pinned by digest.
  #
  # This entry is not optional in the way the others are. A digest pin freezes
  # the OS packages and the interpreter under every hash-pinned wheel, which is
  # the point — but `python:3.12-slim` is rebuilt regularly with patched
  # packages, so a frozen digest with nothing to refresh it is strictly worse
  # than the mutable tag for security patching even while being better for
  # reproducibility. Same shape as the actions above: the pin is only
  # defensible because this exists to bump it.
  #
  # weekly rather than the monthly used above. Actions move slowly and CI
  # proves them as a set; base image rebuilds carry OS CVE fixes, and a month
  # is a long time to sit on one. Both FROM lines use the same image, so
  # weekly is one grouped pull request per rebuild, not a stream of them.
  #
  # Nothing verifies that the digest still matches the tag it is written
  # beside, and that is a deliberate gap rather than an oversight. It cannot be
  # checked after the fact: the registry untags a digest as soon as the tag
  # moves on, so a *correct* pin stops being reachable by its own tag within
  # days of being made, and a check for it would fail on exactly the pins that
  # are right. What is checkable is that the digest is a real image of the
  # claimed Python series, and README.md carries the registry commands for it —
  # run by hand when a pin changes, the same way the Python locks are
  # regenerated by hand. Dependabot rewrites the tag and the digest together,
  # so its own pull requests keep the two consistent without help.
  #
  # What CI does check, since the `image` job in ci.yml, is that the proposed
  # digest produces an image that builds on both release architectures and
  # starts and serves a request. That is the failure these pull requests
  # actually carry — a lockfile whose wheels no longer match the interpreter
  # underneath them — and it used to surface only on a release tag.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      # Both stages track the same image; splitting them would produce two
      # pull requests that only build correctly when merged together.
      base-image:
        patterns:
          - "*"
    # Stay on the 3.12 series. Nothing here reads on the tag's Python version,
    # so `python:3.12-slim` and `python:3.14-slim` are the same kind of update
    # to Dependabot as a rebuild of the tag we are on — it proposed 3.14 in a
    # pull request shaped exactly like the weekly digest refresh this entry
    # exists for, and the two want different amounts of attention. An
    # interpreter series move changes what the hash-pinned wheels are installed
    # against; it wants a deliberate change with CI moved to match, not a merge
    # on a Monday.
    #
    # Only the version is ignored. `3.12-slim` carries no patch component, so
    # within the series there is nothing to bump but the digest, and a
    # digest-only refresh is not a version update — it is what still comes
    # through, which is precisely the CVE patching the pin depends on.
    #
    # Worth knowing how this fails: if these refreshes silently stop arriving,
    # the pin quietly becomes a frozen CVE, which is the failure this entry was
    # written to prevent. Weeks of no base-image pull request while upstream is
    # rebuilding the tag is the symptom. Removing this block restores the old
    # behaviour, series jumps and all.
    #
    # To move series deliberately: drop or narrow this, take the pull request
    # Dependabot then opens, and move the python-version in ci.yml and
    # release.yml with it, along with the tag written in README.md and in the
    # Dockerfile's own comments.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # CI tooling only — build and pip-audit. See the note above on why this is
  # scoped to /.github and why no entry covers the repository root.
  - package-ecosystem: pip
    directory: "/.github"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      ci-tooling:
        patterns:
          - "*"
