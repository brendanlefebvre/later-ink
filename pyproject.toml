[project]
name = "later-ink"
dynamic = ["version"]
description = "OPDS server that bridges read-it-later services to e-readers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ebooklib>=0.18",
    "lxml>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/later_ink/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/later_ink"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pinned so `ruff check` is deterministic across machines/versions.
# E/F = correctness, I = import sorting, UP = pyupgrade. BLE (blind-except)
# is intentionally not selected: epub.py deliberately catches broadly so a
# single bad image or unparseable document can't break EPUB generation.
select = ["E4", "E7", "E9", "F", "I", "UP"]
