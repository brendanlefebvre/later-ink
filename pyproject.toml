[project]
name = "read-later-opds"
version = "0.1.0"
description = "OPDS server that bridges read-it-later services to e-readers"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "ebooklib>=0.18",
    "lxml>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_later_opds"]

[tool.ruff]
target-version = "py311"
